[project]
name = "rechtspraak-mcp"
version = "0.1.2"
description = "MCP-connector (betaversie) voor Belgische en Europese rechtspraak en wetgeving, met controleerbare bron-URL's en VENA-verwijzingen."
requires-python = ">=3.12"
license = "EUPL-1.2"
license-files = ["LICENSE"]
authors = [{ name = "Jef Seghers" }]
readme = "README.md"
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.8.0",
    "pdfplumber>=0.11",
    # Voor de REST-schil (http_api.py). Beide komen al transitief mee met `mcp`,
    # maar we importeren ze rechtstreeks en pinnen ze daarom expliciet.
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[project.urls]
Homepage = "https://github.com/jefseghers-del/rechtspraak-mcp"
Issues = "https://github.com/jefseghers-del/rechtspraak-mcp/issues"

[project.optional-dependencies]
# Browser-gedreven zoeken (opt-in via RECHTSPRAAK_MCP_BROWSER_ZOEK; zie
# rechtspraak_mcp/browser_zoek.py). Na installatie ook: python -m playwright install chromium
browser = ["playwright>=1.40"]

[project.scripts]
rechtspraak-mcp = "rechtspraak_mcp.server:main"
rechtspraak-mcp-http = "rechtspraak_mcp.http_api:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rechtspraak_mcp"]
